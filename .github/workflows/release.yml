name: Release

# Tag a release with `git tag vX.Y.Z && git push origin vX.Y.Z`.
# This workflow builds the Release DMG, publishes it as a GitHub Release
# asset, and updates appcast.xml on main so Sparkle picks up the update.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  SCHEME: Grabbit

jobs:
  release:
    name: Build DMG + publish release
    runs-on: macos-14
    env:
      # Public releases must be Developer ID signed + notarized. For an
      # internal unsigned test build, set the repository variable
      # ALLOW_UNSIGNED_RELEASE to true; otherwise the preflight below refuses
      # to publish.
      ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Latest xcodegen writes project format 77, which needs Xcode 16+.
      # macos-14 runners default to Xcode 15.4, so select Xcode 16 explicitly.
      - name: Select Xcode 16
        run: |
          XCODE=""
          for v in 16.4 16.3 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then XCODE="/Applications/Xcode_${v}.app"; break; fi
          done
          if [ -z "$XCODE" ]; then echo "No Xcode 16 found:"; ls -d /Applications/Xcode*.app 2>/dev/null; exit 1; fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Check release credentials
        id: signing
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          missing=()
          for name in \
            DEVELOPER_ID_CERTIFICATE \
            DEVELOPER_ID_CERTIFICATE_PASSWORD \
            DEVELOPER_ID_IDENTITY \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if [[ ${#missing[@]} -eq 0 ]]; then
            if [[ -z "${TELEGRAM_API_ID:-}" || -z "${TELEGRAM_API_HASH:-}" ]]; then
              echo "::error::Refusing to publish a signed release without TELEGRAM_API_ID/TELEGRAM_API_HASH; the bundled Telegram helper would be unusable for end users."
              exit 1
            fi
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing and notarization enabled."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing release signing secrets: ${missing[*]}"
            if [[ "${ALLOW_UNSIGNED_RELEASE:-}" != "true" ]]; then
              echo "::error::Refusing to publish an unsigned public release. Configure the Developer ID/notary secrets documented in SIGNING.md, or set the repository variable ALLOW_UNSIGNED_RELEASE=true for an internal test build."
              exit 1
            fi
            echo "::warning::ALLOW_UNSIGNED_RELEASE=true: this tag will publish an unsigned, non-notarized build."
          fi

          if [[ -z "${TELEGRAM_API_ID:-}" || -z "${TELEGRAM_API_HASH:-}" ]]; then
            echo "::warning::TELEGRAM_API_ID/TELEGRAM_API_HASH are missing; the bundled Telegram helper will require a local env file and will not work for end users."
          fi

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Vendor media runtime (yt-dlp, ffmpeg, ffprobe, deno)
        run: ./scripts/vendor-media-runtime.sh
        # NOTE: versions are pinned inside scripts/vendor-media-runtime.sh
        # (see DEPENDENCIES.md) so builds stay reproducible.

      - name: Vendor torrent runtime (aria2-next)
        run: ./scripts/vendor-torrent-runtime.sh
        # NOTE: version + SHA-256 are pinned inside
        # scripts/vendor-torrent-runtime.sh (see DEPENDENCIES.md).

      - name: Set up Go for Telegram helper
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache-dependency-path: Tools/telegram-helper/go.sum

      - name: Build Telegram helper
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_HELPER_GOARCH: arm64
        run: |
          if [[ -z "${TELEGRAM_API_ID:-}" || -z "${TELEGRAM_API_HASH:-}" ]]; then
            echo "::warning::TELEGRAM_API_ID/HASH secrets are missing; helper will require a local env file and will not work for end users."
          fi
          ./scripts/vendor-telegram-helper.sh

      - name: Build (Release, unsigned inputs)
        run: >
          xcodebuild -scheme Grabbit
          -configuration Release
          -destination 'platform=macOS'
          build
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
        # Build unsigned, then sign the whole bundle explicitly below. This
        # lets the workflow sign vendored helpers and Sparkle's nested XPC
        # services in the correct order. Public tags require Developer ID
        # signing + notarization; see SIGNING.md.

      - name: Locate built app
        id: app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -name "Grabbit.app" -maxdepth 6 -type d | head -n 1)
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      # Sparkle compares the appcast's sparkle:version against the app's
      # CFBundleVersion. A stale build number ("1") made every check report
      # an update forever, so both plist keys are forced from the tag before
      # signing: appcast (sparkle:version = tag) and app now always match.
      - name: Align bundle versions with the tag
        run: |
          APP_PATH="${{ steps.app.outputs.path }}"
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$APP_PATH/Contents/Info.plist"
          echo "short: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          echo "build: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")"

      - name: Import Developer ID certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          SIGNING_KEYCHAIN: ${{ runner.temp }}/grabbit-signing.keychain-db
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/grabbit-developer-id.p12"
          python3 - "$CERT_PATH" <<'PY'
          import base64, os, sys
          raw = os.environ["DEVELOPER_ID_CERTIFICATE"].strip()
          with open(sys.argv[1], "wb") as fh:
              fh.write(base64.b64decode(raw))
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$CERT_PATH" \
            -k "$SIGNING_KEYCHAIN" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN"
          rm -f "$CERT_PATH"

          if ! security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | grep -Fq "$DEVELOPER_ID_IDENTITY"; then
            echo "::error::The imported certificate does not match DEVELOPER_ID_IDENTITY."
            security find-identity -v -p codesigning "$SIGNING_KEYCHAIN"
            exit 1
          fi

      - name: Sign app with Developer ID
        if: steps.signing.outputs.signed == 'true'
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          CODESIGN_KEYCHAIN: ${{ runner.temp }}/grabbit-signing.keychain-db
        run: ./scripts/sign-app.sh "${{ steps.app.outputs.path }}"

      # The unsigned build's executable is only linker-signed, which leaves
      # the app bundle with an INVALID code signature ("code has no resources
      # but signature indicates they must be present"). Sparkle 2 rejects
      # updates whose new bundle has a corrupted signature even when the
      # EdDSA archive signature is valid. An ad-hoc deep signature makes the
      # bundle valid; EdDSA still provides the actual trust for updates.
      # This is only for internal unsigned builds; public tags use the
      # Developer ID path above.
      - name: Ad-hoc code sign app (unsigned internal build)
        if: steps.signing.outputs.signed != 'true'
        run: |
          APP_PATH="${{ steps.app.outputs.path }}"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --verbose=2 "$APP_PATH"
          codesign -dv "$APP_PATH" 2>&1 | grep -E "Signature|Identifier" || true

      - name: Create DMG (Motrix-style)
        run: |
          brew install create-dmg
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          APP_PATH="${{ steps.app.outputs.path }}"
          # Motrix-style: app + Applications symlink, no background image needed
          # for v1 (create-dmg positions icons; background can be added later).
          create-dmg \
            --volname "Grabbit" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "Grabbit.app" 150 200 \
            --app-drop-link 450 200 \
            "dist/Grabbit-${TAG}.dmg" \
            "$APP_PATH"
          ls -la dist/

      - name: Notarize and staple DMG
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="dist/Grabbit-${GITHUB_REF_NAME}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # The tagged commit's message doubles as the release notes — it is
          # also embedded in the appcast so Sparkle's update dialog shows
          # the same feature list.
          NOTES=$(git log -1 --format=%B "$TAG")
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            INSTALL_NOTE="Developer ID signed and notarized — drag Grabbit.app to Applications and launch it normally."
          else
            INSTALL_NOTE="Unsigned internal build — this one-time step bypasses Gatekeeper: Right-click Grabbit.app → Open → click Open."
          fi
          printf '%s\n\n---\nmacOS 14+ (Apple Silicon). Download the DMG below, drag Grabbit.app to Applications.\n%s\nAuto-updates are delivered via Sparkle once this version is installed.\n' \
            "$NOTES" "$INSTALL_NOTE" > /tmp/release-notes.md
          gh release create "$TAG" "dist/Grabbit-${TAG}.dmg" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md

      # The extension is not on the Chrome Web Store (downloader policy), so
      # every release carries the current full build — the "latest release"
      # page is the documented install source.
      - name: Package + attach the browser extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/package-extension.sh --full
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(python3 -c "import json; print(json.load(open('GrabbitExtension/manifest.json'))['version'])")
          ZIP="dist/grabbit-extension-v${VERSION}-full.zip"
          gh release upload "$TAG" "$ZIP" --clobber
          # Version-less alias for a stable download URL:
          # releases/latest/download/grabbit-extension-latest.zip
          cp "$ZIP" dist/grabbit-extension-latest.zip
          gh release upload "$TAG" dist/grabbit-extension-latest.zip --clobber
          echo "attached $ZIP + grabbit-extension-latest.zip"

      - name: Sign DMG with Sparkle EdDSA key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY secret not set - skipping EdDSA signature"
            echo "EDSIGNATURE=" >> "$GITHUB_ENV"
          else
            echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle-private.pem
            # Download Sparkle's sign_update tool (version must match the
            # Sparkle framework the app links against).
            curl -sL -o /tmp/Sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/2.5.0/Sparkle-2.5.0.tar.xz"
            tar -xf /tmp/Sparkle.tar.xz -C /tmp
            TAG="${GITHUB_REF_NAME}"
            # Sparkle 2.5's sign_update takes the key file via --ed-key-file;
            # -p prints only the bare signature for the appcast attribute.
            SIG=$(/tmp/bin/sign_update --ed-key-file /tmp/sparkle-private.pem -p "dist/Grabbit-${TAG}.dmg")
            echo "EDSIGNATURE=$SIG" >> "$GITHUB_ENV"
            echo "DMG signed (${#SIG} chars)"
          fi

      - name: Update appcast.xml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DMG_URL="https://github.com/sankahchan/grabbit/releases/download/${TAG}/Grabbit-${TAG}.dmg"
          PUBDATE=$(date -u +"%a, %d %b %Y %H:%M:%S %z")
          # Same notes as the GitHub release: Sparkle's update dialog shows
          # them under Release Notes.
          NOTES=$(git log -1 --format=%B "$TAG")
          # Empty when SPARKLE_PRIVATE_KEY is missing; the attribute is then
          # omitted and Sparkle (with SUPublicEDKey configured) will reject the
          # update, which is the safe failure mode.
          SIG="${EDSIGNATURE:-}"
          cat > /tmp/update_appcast.py <<'PYEOF'
          import html, re, sys
          tag, version, dmg_url, pubdate, signature, notes = sys.argv[1:7]
          path = "appcast.xml"
          src = open(path).read()
          sig_attr = f' sparkle:edSignature="{signature}"' if signature else ""
          notes_html = html.escape(notes).replace("\n", "<br/>")
          description = (
              "      <description><![CDATA["
              f'<pre style="font-family: -apple-system; white-space: pre-wrap; margin: 0">{notes_html}</pre>'
              "]]></description>\n"
          )
          item = (
              "    <item>\n"
              f"      <title>{tag}</title>\n"
              f"      <pubDate>{pubdate}</pubDate>\n"
              f"{description}"
              f'      <enclosure url="{dmg_url}" sparkle:version="{version}" '
              f'sparkle:shortVersionString="{version}"{sig_attr} type="application/octet-stream"/>\n'
              "      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>\n"
              "    </item>\n"
              "  </channel>"
          )
          new = re.sub(r"  </channel>", item, src, count=1)
          open(path, "w").write(new)
          print(f"appcast.xml updated for {tag} (edSignature: {'yes' if signature else 'NO — set SPARKLE_PRIVATE_KEY!'})")
          PYEOF
          python3 /tmp/update_appcast.py "$TAG" "$VERSION" "$DMG_URL" "$PUBDATE" "$SIG" "$NOTES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Release $TAG: update appcast.xml"
          # main may have moved since the tag (e.g. a hotfix pushed while the
          # build ran) — rebase the appcast commit before pushing so the
          # release never fails on a rejected non-fast-forward.
          git pull --rebase origin main
          git push origin HEAD:main
          # Sparkle's SUFeedURL points at
          #   releases/latest/download/appcast.xml
          # so the feed must ALSO exist as a release asset — committing it to
          # main alone leaves that URL 404ing (which surfaces as "Update
          # Error! An error occurred in retrieving update information").
          gh release upload "$TAG" appcast.xml --clobber

      - name: Clean up signing keychain
        if: always() && steps.signing.outputs.signed == 'true'
        env:
          SIGNING_KEYCHAIN: ${{ runner.temp }}/grabbit-signing.keychain-db
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true
