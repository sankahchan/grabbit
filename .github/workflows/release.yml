name: Release

# Tag a release with `git tag vX.Y.Z && git push origin vX.Y.Z`.
# This workflow builds the Release DMG, publishes it as a GitHub Release
# asset, and updates appcast.xml on main so Sparkle picks up the update.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  SCHEME: Grabbit

jobs:
  release:
    name: Build DMG + publish release
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Latest xcodegen writes project format 77, which needs Xcode 16+.
      # macos-14 runners default to Xcode 15.4, so select Xcode 16 explicitly.
      - name: Select Xcode 16
        run: |
          XCODE=""
          for v in 16.4 16.3 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then XCODE="/Applications/Xcode_${v}.app"; break; fi
          done
          if [ -z "$XCODE" ]; then echo "No Xcode 16 found:"; ls -d /Applications/Xcode*.app 2>/dev/null; exit 1; fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Vendor media runtime (yt-dlp, ffmpeg, ffprobe, deno)
        run: ./scripts/vendor-media-runtime.sh
        # NOTE: versions are pinned inside scripts/vendor-media-runtime.sh
        # (see DEPENDENCIES.md) so builds stay reproducible.

      - name: Vendor torrent runtime (aria2-next)
        run: ./scripts/vendor-torrent-runtime.sh
        # NOTE: version + SHA-256 are pinned inside
        # scripts/vendor-torrent-runtime.sh (see DEPENDENCIES.md).

      - name: Build (Release, unsigned)
        run: >
          xcodebuild -scheme Grabbit
          -configuration Release
          -destination 'platform=macOS'
          build
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
        # TODO: sign with Developer ID + notarize + enable Hardened Runtime
        # before public distribution. Grabbit is not sandboxed (arbitrary file
        # writes, subprocesses, native-messaging stdio), so users will get a
        # Gatekeeper warning on unsigned builds.

      - name: Locate built app
        id: app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -name "Grabbit.app" -maxdepth 6 -type d | head -n 1)
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create DMG (Motrix-style)
        run: |
          brew install create-dmg
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          APP_PATH="${{ steps.app.outputs.path }}"
          # Motrix-style: app + Applications symlink, no background image needed
          # for v1 (create-dmg positions icons; background can be added later).
          create-dmg \
            --volname "Grabbit" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "Grabbit.app" 150 200 \
            --app-drop-link 450 200 \
            "dist/Grabbit-${TAG}.dmg" \
            "$APP_PATH"
          ls -la dist/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" "dist/Grabbit-${TAG}.dmg" \
            --title "$TAG" \
            --notes "Grabbit $TAG — macOS 14+ (Apple Silicon).

          Download the DMG below, drag Grabbit.app to Applications.
          First launch: Right-click Grabbit.app → Open → click Open.
          (Unsigned build — this one-time step bypasses Gatekeeper.)
          Auto-updates are delivered via Sparkle once this version is installed."

      - name: Sign DMG with Sparkle EdDSA key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY secret not set - skipping EdDSA signature"
            echo "EDSIGNATURE=" >> "$GITHUB_ENV"
          else
            echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle-private.pem
            # Download Sparkle's sign_update tool (version must match the
            # Sparkle framework the app links against).
            curl -sL -o /tmp/Sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/2.5.0/Sparkle-2.5.0.tar.xz"
            tar -xf /tmp/Sparkle.tar.xz -C /tmp
            TAG="${GITHUB_REF_NAME}"
            # Sparkle 2.5's sign_update takes the key file via --ed-key-file;
            # -p prints only the bare signature for the appcast attribute.
            SIG=$(/tmp/bin/sign_update --ed-key-file /tmp/sparkle-private.pem -p "dist/Grabbit-${TAG}.dmg")
            echo "EDSIGNATURE=$SIG" >> "$GITHUB_ENV"
            echo "DMG signed (${#SIG} chars)"
          fi

      - name: Update appcast.xml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DMG_URL="https://github.com/sankahchan/grabbit/releases/download/${TAG}/Grabbit-${TAG}.dmg"
          PUBDATE=$(date -u +"%a, %d %b %Y %H:%M:%S %z")
          # Empty when SPARKLE_PRIVATE_KEY is missing; the attribute is then
          # omitted and Sparkle (with SUPublicEDKey configured) will reject the
          # update, which is the safe failure mode.
          SIG="${EDSIGNATURE:-}"
          cat > /tmp/update_appcast.py <<'PYEOF'
          import re, sys
          tag, version, dmg_url, pubdate, signature = sys.argv[1:6]
          path = "appcast.xml"
          src = open(path).read()
          sig_attr = f' sparkle:edSignature="{signature}"' if signature else ""
          item = (
              "    <item>\n"
              f"      <title>{tag}</title>\n"
              f"      <pubDate>{pubdate}</pubDate>\n"
              f'      <enclosure url="{dmg_url}" sparkle:version="{version}" '
              f'sparkle:shortVersionString="{version}"{sig_attr} type="application/octet-stream"/>\n'
              "      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>\n"
              "    </item>\n"
              "  </channel>"
          )
          new = re.sub(r"  </channel>", item, src, count=1)
          open(path, "w").write(new)
          print(f"appcast.xml updated for {tag} (edSignature: {'yes' if signature else 'NO — set SPARKLE_PRIVATE_KEY!'})")
          PYEOF
          python3 /tmp/update_appcast.py "$TAG" "$VERSION" "$DMG_URL" "$PUBDATE" "$SIG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Release $TAG: update appcast.xml"
          git push origin HEAD:main
          # Sparkle's SUFeedURL points at
          #   releases/latest/download/appcast.xml
          # so the feed must ALSO exist as a release asset — committing it to
          # main alone leaves that URL 404ing (which surfaces as "Update
          # Error! An error occurred in retrieving update information").
          gh release upload "$TAG" appcast.xml --clobber
