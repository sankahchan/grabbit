name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build + Test
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Latest xcodegen writes project format 77, which needs Xcode 16+.
      # macos-14 runners default to Xcode 15.4, so select Xcode 16 explicitly.
      - name: Select Xcode 16
        run: |
          XCODE=""
          for v in 16.4 16.3 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then XCODE="/Applications/Xcode_${v}.app"; break; fi
          done
          if [ -z "$XCODE" ]; then echo "No Xcode 16 found:"; ls -d /Applications/Xcode*.app 2>/dev/null; exit 1; fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug, unsigned)
        run: >
          xcodebuild -scheme Grabbit
          -configuration Debug
          -destination 'platform=macOS'
          build
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

      # Tests fail loudly on purpose — a red PR should not merge.
      - name: Test
        run: >
          xcodebuild test -scheme Grabbit
          -destination 'platform=macOS'
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

      # Diagnostic: what localizations actually made it into the built app?
      # (Myanmar switching silently fails when my.lproj is missing.)
      - name: List built localizations
        if: always()
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 4 -name "Grabbit.app" -type d 2>/dev/null | head -1)
          echo "App: $APP"
          ls "$APP/Contents/Resources/" | grep -i lproj || echo "NO .lproj DIRS"
