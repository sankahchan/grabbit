name: Grabbit
options:
  deploymentTarget:
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.5.0"
targets:
  Grabbit:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Grabbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sankahchan.grabbit
        PRODUCT_NAME: Grabbit
        ARCHS: arm64
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Grabbit/Engine/ALPNPin.h
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Grabbit/Info.plist
      properties:
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        NSHumanReadableCopyright: Copyright © 2026 sankahchan
        LSMinimumSystemVersion: "14.0"
        SUFeedURL: https://github.com/sankahchan/grabbit/releases/latest/download/appcast.xml
        SUPublicEDKey: "TODO: run Sparkle's generate_keys tool and paste the public key here before public distribution"
        CFBundleURLTypes:
          - CFBundleURLName: "Grabbit download URL"
            CFBundleURLSchemes: ["grabbit"]
    dependencies:
      - package: Sparkle
        product: Sparkle
    # Copies the vendored media runtime (scripts/vendor-media-runtime.sh drops
    # binaries into Grabbit/Resources/bin, dylibs into Grabbit/Resources/lib)
    # into the built app. Runs at build time so it works whether the binaries
    # were vendored before or after `xcodegen generate`.
    postBuildScripts:
      - name: Install media runtime into Resources
        basedOnDependencyAnalysis: false
        script: |
          BIN_SRC="${SRCROOT}/Grabbit/Resources/bin"
          LIB_SRC="${SRCROOT}/Grabbit/Resources/lib"
          RES_DST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          mkdir -p "$RES_DST/bin"
          if [ -d "$BIN_SRC" ]; then cp -f "$BIN_SRC/"* "$RES_DST/bin/" 2>/dev/null || true; fi
          if [ -d "$LIB_SRC" ] && [ -n "$(ls -A "$LIB_SRC" 2>/dev/null)" ]; then
            mkdir -p "$RES_DST/lib"
            cp -f "$LIB_SRC/"* "$RES_DST/lib/"
          fi
  GrabbitTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: GrabbitTests
    dependencies:
      - target: Grabbit
schemes:
  Grabbit:
    build:
      targets:
        Grabbit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GrabbitTests
