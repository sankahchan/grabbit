name: Grabbit
options:
  deploymentTarget:
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.5.0"
targets:
  Grabbit:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Grabbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sankahchan.grabbit
        PRODUCT_NAME: Grabbit
        ARCHS: arm64
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: Grabbit/Engine/ALPNPin.h
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Grabbit/Info.plist
      properties:
        CFBundleShortVersionString: 1.6.0
        # Keep in lockstep with CFBundleShortVersionString: Sparkle compares
        # the appcast's sparkle:version against this build number, and a
        # stale "1" here makes every check report a new update forever.
        # release.yml also forces both keys from the tag.
        CFBundleVersion: "1.6.0"
        NSHumanReadableCopyright: Copyright © 2026 sankahchan
        LSMinimumSystemVersion: "14.0"
        SUFeedURL: https://github.com/sankahchan/grabbit/releases/latest/download/appcast.xml
        SUPublicEDKey: "DzIXu4kgfyZoGsC47pDCwb4Z8d3h0jf4ou4gReVz+54="
        SUScheduledCheckInterval: 21600
        CFBundleURLTypes:
          - CFBundleURLName: "Grabbit download URL"
            CFBundleURLSchemes: ["grabbit"]
          - CFBundleURLName: "Magnet link"
            CFBundleURLSchemes: ["magnet"]
    dependencies:
      - package: Sparkle
        product: Sparkle
    # Copies the vendored media runtime (scripts/vendor-media-runtime.sh drops
    # binaries into Grabbit/Resources/bin, dylibs into Grabbit/Resources/lib)
    # into the built app. Runs at build time so it works whether the binaries
    # were vendored before or after `xcodegen generate`.
    postBuildScripts:
      - name: Install media runtime into Resources
        basedOnDependencyAnalysis: false
        script: |
          BIN_SRC="${SRCROOT}/Grabbit/Resources/bin"
          LIB_SRC="${SRCROOT}/Grabbit/Resources/lib"
          RES_DST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          mkdir -p "$RES_DST/bin"
          if [ -d "$BIN_SRC" ]; then cp -f "$BIN_SRC/"* "$RES_DST/bin/" 2>/dev/null || true; fi
          if [ -d "$LIB_SRC" ] && [ -n "$(ls -A "$LIB_SRC" 2>/dev/null)" ]; then
            mkdir -p "$RES_DST/lib"
            cp -f "$LIB_SRC/"* "$RES_DST/lib/"
          fi
          # The native-messaging helper ships with the app so Sparkle
          # updates refresh the installed copy (NativeHostInstaller).
          HELPER_SRC="${SRCROOT}/GrabbitExtension/native-messaging/grabbit-native-helper.py"
          if [ -f "$HELPER_SRC" ]; then cp -f "$HELPER_SRC" "$RES_DST/grabbit-native-helper.py"; fi
          # Bundle this build's release notes (the commit message at HEAD —
          # the tagged release commit on CI) so the app can show a
          # "What's New" sheet after an update without any network access.
          if git -C "$SRCROOT" rev-parse --git-dir >/dev/null 2>&1; then
            git -C "$SRCROOT" log -1 --format=%B > "$RES_DST/ReleaseNotes.txt" 2>/dev/null || true
          fi
  GrabbitTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: GrabbitTests
    settings:
      base:
        # Newer Xcode refuses to code-sign a test bundle without one.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Grabbit
schemes:
  Grabbit:
    build:
      targets:
        Grabbit: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GrabbitTests
